# config/routes.yaml — which model a request names, and which providers may serve it.
#
# A client asks for a *model*; this file decides which vendor answers. A request
# for `fast` is served by openai/gpt-4o-mini, and if that provider is rate-limited
# or down, by anthropic/claude-haiku-4-5. The client never learns which one ran,
# and cannot ask for a vendor directly — that is the whole point.
#
# Shape, per `muse.routes`:
#
#   version   the schema version of this file. Bumped when the shape changes.
#   routes    the routing table. Each entry is one model name.
#     model          what the client asks for. Unique across the file.
#     description    for `caf contract` and for a human reading a diff.
#     candidates     ordered, primary first. The first success wins; a failure
#                    advances to the next. At least one, and a route with one
#                    candidate is not a fallback route — it is a single vendor
#                    with extra syntax, so say so in the description.
#       provider      a name in the provider registry. Validated against the
#                     registry at boot, so a typo here is a boot failure and not a
#                     503 on the first request.
#       model         the vendor's model id. Optional: omitted, it inherits the
#                     route's `model`, which is the common case where the two
#                     names agree.
#       weight        reserved for load balancing in a later packet. Present in
#                     the schema and ignored by the router, so adding it later is
#                     not a config-format change.
#     timeout_seconds  per-attempt wall clock for one provider call. Optional;
#                     the default applies when absent.
#     max_attempts     how many times the router retries ONE candidate before
#                     advancing. Only transient failures are retried; a rejected
#                     credential or a malformed request advances immediately.
#                     Defaults to 1 — no retry — because a retry that has not been
#                     measured against a real incident is latency added to every
#                     failure.
#     budget_seconds   the wall-clock ceiling on ONE candidate's whole retry loop,
#                     backoff included. The attempt count alone does not bound time:
#                     six attempts against a 4s ceiling is 20s of waiting before the
#                     last attempt is even sent. Checked before each wait, so muse
#                     never starts a sleep that would carry the request past it.
#     backoff_jitter   the fraction of each delay that is randomised, in [0, 1].
#                     Without it every muse that failed at the same instant retries
#                     at the same instant, and a provider recovering from an outage
#                     is hit by a wave instead of a trickle. The window is
#                     [ceiling*(1-jitter), ceiling], so the backoff can never go
#                     backwards and jitter can never exceed the ceiling.
#     retry_indeterminate
#                     whether a *read* timeout is retried. A read timeout means the
#                     request was sent and the answer did not arrive, so the vendor
#                     may have completed and billed it. Off by default: retrying it
#                     can charge a customer twice for one request, and muse has no
#                     idempotency key to ask the vendor which happened (PLAN §7
#                     assigns one to muse; it is not built). Set it per route, and
#                     only for a route whose price makes duplicate spend cheaper
#                     than a 503.
#
# Order matters and is not alphabetical. A route lists its cheapest adequate model
# first and its most capable one last, so the fallback costs more but serves more.
# Reordering a route is a behaviour change to spend, not a refactor.

version: 1

defaults:
  # Applied to every route that does not state its own. Two candidates in every
  # route is deliberate: a fallback chain of one is a single vendor.
  max_attempts: 1
  backoff_initial_seconds: 0.25
  backoff_max_seconds: 2.0
  backoff_jitter: 0.5
  timeout_seconds: 30.0
  # Twenty seconds of retrying per candidate, and at most two candidates, so a route
  # cannot hold a caller's request open through more than 40s of waiting plus the
  # attempts themselves.
  budget_seconds: 20.0

routes:
  # The house model for completions: DeepSeek v4.1 Flash behind opencode's
  # OpenAI-compatible gateway. `fast` is what an answer, a receipt and a
  # draft are served by — the prose work.
  - model: fast
    description: Small, cheap, for classification, extraction and routing.
    # Three candidates, in order of preference, and each one is a DIFFERENT way
    # to reach a model. That is the point of a fallback chain: a gateway being
    # down, an aggregator having no capacity, and the vendor itself being
    # unreachable are three different failures, and one credential reaching the
    # vendor directly survives all three.
    candidates:
      - provider: opencode
        model: deepseek-v4.1-flash
      - provider: openrouter
        model: deepseek/deepseek-chat
      - provider: deepseek
        model: deepseek-chat
    timeout_seconds: 20.0

  # The most capable model available, for reasoning and long output. Same
  # gateway; opencode routes to a larger model behind the same credential, so
  # the house stack needs one key rather than one per vendor.
  - model: smart
    description: The most capable model available, for reasoning and long output.
    candidates:
      - provider: opencode
        model: deepseek-v4.1
      # The aggregator is a different way to reach a larger model, and the
      # vendor itself is a third. A reasoning turn is the one that must not
      # fail, so the chain is three deep here as well.
      - provider: openrouter
        model: deepseek/deepseek-chat
      - provider: deepseek
        model: deepseek-reasoner
    max_attempts: 3
    budget_seconds: 30.0
    timeout_seconds: 60.0

  # Decisions are a DIFFERENT operation from a completion, and they go to a
  # different vendor: TypeSafe's Jev, which answers calibrated questions
  # rather than generating prose. `POST /v1/decisions` names this route.
  #
  # Why not `fast`: litellm ships a decisions transformation for a specific
  # set of vendors (openai, azure_ai, cloudflare, hosted_vllm, perplexity,
  # strands_decider, typesafe) and none for anthropic or deepseek. A decision
  # route naming a vendor with no transformation reaches litellm, is refused,
  # and surfaces as a 503 for every request — so the route names the vendor
  # whose decisions endpoint exists.
  - model: decide
    description: "Calibrated decisions about an input: classification, disposition, weight."
    candidates:
      - provider: typesafe
        model: jev-latest
    timeout_seconds: 20.0

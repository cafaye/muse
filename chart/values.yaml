# Generated by `cafe gen chart` from this project's cafaye.yml.
#
# This is the chart's DEPLOYMENT-TIME half, and it is the one file in the
# chart meant to be edited: the values commit is the write path of the
# pull-based loop (DEPLOYMENT.md — "a values commit, then wait for
# sync"), and this is the file that commit edits. The templates are the
# contract and are not. Re-running `cafe gen chart` refuses to overwrite
# this file without -force, so an edit is never lost to an accident.
#
# The defaults below are derived from the manifest where the manifest
# carries the fact, and stated here where it does not.

# The image the service runs.
#
# The repository is the fleet's private OCI registry (GHCR), because the
# substrate is closed source and a pull-based system needs somewhere to
# pull from. The tag is a VALUE and is never `latest`: a floating tag
# is a deploy that changes when somebody else pushes, and the loop
# exists so that what runs is exactly what the values commit said.
# Set it at release time; the default is the chart's own version.
image:
  repository: ghcr.io/cafaye/muse
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# The read-only pull secret on the box, created once, out of band:
#
#   kubectl create secret docker-registry muse-ghcr \
#     --docker-server=ghcr.io \
#     --docker-username=<deploy-bot> \
#     --docker-password=<read-only-token>
#
# The chart NAMES the secret and never contains a credential. A
# credential that reaches this file is a credential in a git
# repository, which is the one thing the pull-based loop exists to
# prevent.
imagePullSecrets: muse-ghcr

# The secret holding the service's environment, also created on the box
# and also by name only. The Deployment reads it with envFrom, so a
# value is rotated by replacing the secret and restarting the pods —
# not by editing a generated file.
secretName: muse-secrets
migrationSecretName: muse-secrets

# How many copies of the service run. One is the default for a service
# whose state is the cluster's, not the pod's; raise it when the
# service scales horizontally.
replicas: 1

# The Service in front of the container.
service:
  type: ClusterIP
  port: 80

# How the service is reached from outside the cluster: an Ingress,
# gated on `ingress.enabled`, which is FALSE by default.
#
# A chart that suddenly routes traffic is a defect: the substrate's
# first sync happens before any operator has set a host, and an
# Ingress with no host is a silent misroute — the class of defect
# kit's /up healthcheck was. The services the fleet exposes (gateway,
# parlor) turn the knob on in their values commit; identity and
# courier stay internal.
#
# The edge is Traefik, k3s's default ingress controller, with
# cert-manager in front of it (DEPLOYMENT.md:28 — "Ingress + TLS |
# Traefik (k3s default) + cert-manager | declarative, no edge
# box"). The ClusterIssuer is created ONCE PER CLUSTER by the
# substrate (a follow-up, not this packet); this block only NAMES
# it — the same "names the secret and never contains a credential"
# discipline the imagePullSecrets block uses. Empty means no TLS: a
# secret nothing writes.
ingress:
  enabled: false
  className: traefik
  host: ""
  clusterIssuer: ""
  tls: true
  path: /
  pathType: Prefix

# The service's environment, as NAME: value pairs.
#
# The manifest carries no env — a service's configuration is its own,
# and cafe will not guess it — so this starts empty and is filled per
# deployment, or at generation time with repeated -env flags:
#
#   cafe gen chart -env DATABASE_URL=... -env API_KEY=...
env: {}

# What the container is allowed to ask for and keep. Requests are what
# the scheduler places the pod on the basis of; limits are what it is
# killed at. These are starting points for a small service on a shared
# box, not a measurement — adjust them to the service's real footprint.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# The readiness probe's timing. The PATH is not here: it is /readyz,
# the fleet's contract, baked into the template — see the chart README
# for why a readiness path that can be edited is a defect waiting.
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10

# The namespace the service lands in. One service per namespace, so the
# namespace is the unit Argo syncs and the unit a rollback reverts.
namespace: muse

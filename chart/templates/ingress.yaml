# Code generated by `cafe gen chart`. DO NOT EDIT.
#
# The Ingress: how the service is reached from outside the cluster.
# Off by default and gated on `ingress.enabled` in values.yaml — see
# that file for why it is off, and for the issuer the chart names
# and never creates.
{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}
{{- fail "cafe gen chart: ingress.enabled is true and ingress.host is empty — an Ingress with no host is a silent misroute; set ingress.host in values.yaml" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: muse
  labels:
    app.kubernetes.io/name: muse
    app.kubernetes.io/instance: muse
    app.kubernetes.io/managed-by: cafe
  {{- if .Values.ingress.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
  {{- end }}

spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if and .Values.ingress.tls .Values.ingress.clusterIssuer }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: muse-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: muse
                port:
                  number: {{ .Values.service.port }}
{{- end }}

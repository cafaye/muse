[project]
name = "muse"
version = "0.2.0"
description = "muse — LLM routing, credentials vault, token metering for cafaye"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.14"
dependencies = [
    # Floors are the newest releases that satisfy the machine-wide uv
    # `exclude-newer = "7 days"` supply-chain quarantine (see AGENTS.md).
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    # Packet muse-02. Each floor is justified in README.md#dependencies.
    "litellm>=1.102.0",         # the router/metering engine muse embeds as a library
    "cryptography>=50.0.1",     # AES-256-GCM for the credentials vault
    "tenacity>=9.1.4",          # per-candidate retry backoff
    "psycopg[binary]>=3.3.6",   # postgres: vault_secrets + outbox_events
    "pyyaml>=6.0.3",            # config/routes.yaml
    "psycopg-pool>=3.3.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    # Packet muse-06: JWT verification against identity's JWKS. `algorithms=[...]` is
    # a parameter of joserfc's decode, so RS256 is pinned in the call rather than
    # checked afterwards — see muse/auth.py.
    "joserfc>=1.7.5",
    # The JWKS fetch. Already in the runtime closure through litellm -> openai, so
    # declaring it adds nothing to the image; it was dev-only before muse-06 and
    # tests/test_dependencies.py would (correctly) refuse an undeclared import.
    "httpx>=0.28.1",
    # Imported by src/muse at module scope, so declared rather than inherited from
    # fastapi's pins. See tests/test_dependencies.py.
    "pydantic>=2.13.5",         # the request/response models in api.py and main.py
    "starlette>=1.6.0",         # the ASGI types, headers and HTTPException
]

[project.optional-dependencies]
otel = [
    "opentelemetry-exporter-otlp>=1.44.0",
]

[dependency-groups]
dev = [
    # The suite exercises the endpoint path, which imports the OTLP exporter, so the
    # exporter is a *test* dependency whatever else it is. Asking for it through the
    # extra rather than repeating its floor here keeps one declaration: a floor
    # written twice is a floor that drifts, and a drifted floor is this bug again.
    # `uv sync --locked` installs the dev group, so `bin/prime` gets the exporter —
    # which is what it could not do on a fresh clone before (muse-03b). The image is
    # unaffected: the Dockerfile installs with --no-dev, which
    # tests/test_dependencies.py::test_the_exporter_stays_out_of_the_image asserts.
    "muse[otel]",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "anyio>=4.15.1",
    "ruff>=0.14.4",
    # Contract tests only (PLAN §3.3): validates emitted envelopes against
    # core's schemas when a core checkout is pointed at by MUSE_CORE_SCHEMAS.
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --cov=muse --cov-report=term-missing --cov-fail-under=100"
markers = [
    "unit: fast, isolated unit test",
    "integration: exercises more than one component",
]

[tool.coverage.run]
source = ["muse"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
